<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Кабинет кассира — Baden Uktus</title>
<style>
  :root { --gold:#a8865f; --bg:#0f0f10; --card:#1a1a1c; --text:#f3efe9; --muted:#9a948c; --border:#2c2c30; --red:#e0574a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1c1a17 0%, var(--bg) 60%);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px;
  }
  .card {
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:36px 28px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .badge {
    width:56px; height:56px; margin:0 auto 20px; border-radius:16px;
    background:linear-gradient(135deg,#c8a273,#8f6f4a); display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 8px 24px rgba(168,134,95,.35);
  }
  h1 { font-size:19px; margin:0 0 6px; font-weight:650; letter-spacing:.2px; }
  p  { font-size:14px; color:var(--muted); margin:0 0 22px; line-height:1.5; }
  .spinner {
    width:30px; height:30px; margin:6px auto 0; border:3px solid var(--border);
    border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .btn {
    display:none; width:100%; margin-top:20px; padding:14px 18px; border:none; border-radius:12px;
    background:var(--gold); color:#1a1a1c; font-size:15px; font-weight:650; cursor:pointer; text-decoration:none;
  }
  .btn:active { opacity:.85; }
  .err { display:none; color:var(--red); font-size:13.5px; margin-top:16px; line-height:1.5; }
  .hint { margin-top:18px; font-size:12px; color:#6f6a62; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">🔑</div>
    <h1>Кабинет кассира</h1>
    <p id="status">Подключаемся к серверу лояльности…</p>
    <div class="spinner" id="spin"></div>
    <a class="btn" id="go" href="#">Открыть вручную →</a>
    <div class="err" id="err"></div>
    <div class="hint">Сохраните эту страницу в закладки — адрес постоянный,<br>даже если сервер переключится.</div>
  </div>
<script>
  // Постоянная точка входа для кассиров. Реальный адрес сервера — эфемерный
  // cloudflared-туннель, поэтому берём его из loyalty_url.json (обновляется
  // loyalty-watchdog при каждой ротации) и переадресуем на живой /cashier.
  (async function () {
    const statusEl = document.getElementById('status');
    const spin = document.getElementById('spin');
    const go = document.getElementById('go');
    const err = document.getElementById('err');
    function fail(msg) {
      spin.style.display = 'none';
      statusEl.textContent = 'Не удалось подключиться';
      err.style.display = 'block';
      err.textContent = msg;
    }
    try {
      const res = await fetch('../loyalty_url.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('json ' + res.status);
      const data = await res.json();
      let base = (data && data.url || '').trim().replace(/\/+$/, '');
      if (!/^https:\/\/.+/.test(base)) throw new Error('empty url');
      const target = base + '/cashier';
      // показать кнопку-фолбэк на случай, если авто-редирект заблокирован
      go.href = target; go.style.display = 'block';
      statusEl.textContent = 'Открываем кабинет…';
      location.replace(target);
    } catch (e) {
      fail('Сервер лояльности сейчас недоступен. Обновите страницу через минуту или откройте позже.');
    }
  })();
</script>
</body>
</html>
